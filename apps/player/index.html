<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>AA Game Sandbox Player</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #070b18;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }
      #stage-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #hud-root,
      #controls-root,
      #lobby-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #lobby-root {
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #status-banner {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #94a3b8;
        font-size: 14px;
        z-index: 5;
      }
      .lobby-card {
        pointer-events: auto;
        width: min(360px, 90vw);
        background: rgba(15, 23, 42, 0.94);
        border: 1px solid rgba(56, 189, 248, 0.45);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      }
      .lobby-btn {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="stage-root"></div>
    <div id="hud-root"></div>
    <div id="controls-root"></div>
    <div id="lobby-root"></div>
    <div id="status-banner">等待工作台加载游戏沙箱...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
